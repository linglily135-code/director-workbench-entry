<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>镜序 · AI 影像创作台</title>
  <style>
    :root{color-scheme:light;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#17171a}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:46px 42px;border:1px solid rgba(20,20,24,.08);border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 28px 80px rgba(20,20,30,.09)}
    .mark{display:grid;width:48px;height:48px;place-items:center;border-radius:15px;background:#17171a;color:white;font-size:22px;box-shadow:0 10px 24px rgba(20,20,25,.16)}
    h1{margin:25px 0 10px;font-size:28px;letter-spacing:-.04em}p{margin:0;color:#6d6d75;line-height:1.75}
    .line{height:4px;margin-top:30px;overflow:hidden;border-radius:99px;background:#ececf0}
    .line::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#17171a;animation:move 1.25s ease-in-out infinite}
    a{display:inline-block;margin-top:24px;color:#17171a;font-size:14px;font-weight:650;text-decoration:none}
    [hidden]{display:none!important}
    @keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
    @media(prefers-reduced-motion:reduce){.line::after{animation:none;width:100%}}
  </style>
</head>
<body data-loader-version="3">
  <main>
    <div class="mark">✦</div>
    <h1 id="heading">正在打开镜序</h1>
    <p id="message">正在连接公司电脑…</p>
    <div id="progress" class="line" aria-hidden="true"></div>
    <a id="enter" href="#" hidden>重新连接 →</a>
  </main>
  <script>
    (function(){
    var heading=document.getElementById("heading");
    var message=document.getElementById("message");
    var progress=document.getElementById("progress");
    var enter=document.getElementById("enter");
    var stableProxy="https://jingxu-workbench.linglily135.workers.dev";
    var attempts=0,busy=false,retryTimer=null,deadline=Date.now()+65000;
    async function connect(){
      if(busy)return;
      busy=true;attempts++;
      enter.hidden=true;progress.hidden=false;
      var controller=new AbortController();
      var timeout=setTimeout(function(){controller.abort()},5000);
      try{
        if(stableProxy){location.replace(stableProxy);return}
        var response=await fetch("./target.json?v="+Date.now(),{
          cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer",redirect:"error",signal:controller.signal
        });
        if(!response.ok)throw new Error("unreachable");
        var target=await response.json();
        if(target&&target.online===false&&!target.url)throw new Error("recovering");
        var parsed=new URL(target.url||"");
        if(parsed.protocol!=="https:"||parsed.username||parsed.password||parsed.port||
          !/^[a-z0-9-]+\.trycloudflare\.com$/i.test(parsed.hostname)||
          parsed.pathname!=="/"||parsed.search||parsed.hash)throw new Error("invalid");
        location.replace(parsed.origin);
      }catch(error){
        heading.textContent="正在恢复公网连接";
        message.textContent=error.message==="recovering"
          ?"公网通道正在重新连接，这不代表公司网站或任务数据已丢失。"
          :"暂时无法取得当前入口，可能是网络或入口服务波动，不代表账号或密码错误。";
        progress.hidden=true;enter.hidden=false;enter.textContent="重新检查连接 →";
        if(attempts<6&&Date.now()<deadline){
          message.textContent+=" 本页会自动再检查，请稍候。";
          retryTimer=setTimeout(connect,Math.min(1000*Math.pow(2,attempts-1),10000));
        }else{
          heading.textContent="暂时无法连接镜序";
          message.textContent+=" 自动检查已暂停，可点击下方按钮重试或联系管理员。";
        }
      }finally{clearTimeout(timeout);busy=false}
    }
    enter.href=location.pathname;
    enter.onclick=function(event){event.preventDefault();clearTimeout(retryTimer);attempts=0;deadline=Date.now()+65000;connect()};
    connect();
  })();
  </script>
</body>
</html>
